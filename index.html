<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
  <h1 class="title">TETRIS</h1>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Cambiar entre modo oscuro y modo claro">
    <span aria-hidden="true">🌙</span>
    <span class="track"><span class="knob"></span></span>
    <span aria-hidden="true">☀️</span>
  </button>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">PODER</span>
          <span class="value" id="power">—</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
        </div>

        <div class="panel-section">
          <span class="label">DESAFÍO</span>
          <span class="value challenge-text" id="challenge">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <div id="pause-menu" class="pause-menu hidden">
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="controls-btn" class="menu-btn" aria-expanded="false">Ver controles</button>
          <ul id="controls-list" class="controls-list hidden">
            <li><b>← →</b> Mover</li>
            <li><b>↓</b> Bajar</li>
            <li><b>↑ / X</b> Rotar</li>
            <li><b>Espacio</b> Caída rápida</li>
            <li><b>P / Esc</b> Pausa</li>
            <li><b>M</b> Silenciar</li>
          </ul>
          <label class="level-select">Nivel inicial
            <select id="start-level"></select>
          </label>
        </div>
      </div>
    </div>
  </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
